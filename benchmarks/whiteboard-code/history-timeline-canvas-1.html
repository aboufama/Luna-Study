<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'"><style>*{box-sizing:border-box}html,body{margin:0;width:800px;height:500px;overflow:hidden;font-family:Arial,sans-serif;background:white}#stage{position:relative;width:800px;height:500px}svg{overflow:visible}</style></head><body><main id="stage"><canvas width="800" height="500"></canvas></main><script>window.__done=false;window.__error=null;window.__texts=[];window.__hits=[];window.__draws=[];window.addEventListener('error',e=>window.__error=String(e.message).slice(0,180));

function draw(ctx, hit) {
	ctx.clearRect(0, 0, 800, 500);
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(0, 0, 800, 500);
	ctx.fillStyle = "#111111";
	ctx.font = "bold 24px Arial";
	ctx.textAlign = "center";
	ctx.textBaseline = "middle";
	ctx.fillText("Milestones in science", 400, 48);
	hit("heading", 250, 30, 300, 36);
	const y = 250;
	const x0 = 80;
	const x1 = 720;
	const minYear = 1859;
	const maxYear = 1969;
	ctx.strokeStyle = "#111111";
	ctx.lineWidth = 2;
	ctx.beginPath();
	ctx.moveTo(x0, y);
	ctx.lineTo(x1, y);
	ctx.stroke();
	hit("timeline", x0, y - 8, x1 - x0, 16);
	const events = [
		{
			id: "darwin",
			year: 1859,
			label: "On the Origin of Species",
			x: x0,
			above: true,
			tx: 48,
			ty: 142,
			tw: 250,
			align: "left"
		},
		{
			id: "einstein",
			year: 1905,
			label: "Special relativity",
			x: x0 + (1905 - minYear) / (maxYear - minYear) * (x1 - x0),
			above: false,
			tx: 265,
			ty: 337,
			tw: 210,
			align: "center"
		},
		{
			id: "moon",
			year: 1969,
			label: "First Moon landing",
			x: x1,
			above: true,
			tx: 520,
			ty: 142,
			tw: 200,
			align: "right"
		}
	];
	for (const e of events) {
		const stemEnd = e.above ? 194 : 306;
		ctx.strokeStyle = "#111111";
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.moveTo(e.x, y);
		ctx.lineTo(e.x, stemEnd);
		ctx.stroke();
		ctx.fillStyle = "#111111";
		ctx.beginPath();
		ctx.arc(e.x, y, 6, 0, Math.PI * 2);
		ctx.fill();
		ctx.textAlign = e.align;
		ctx.textBaseline = "middle";
		ctx.font = "16px Arial";
		const labelY = e.above ? e.ty : e.ty;
		const yearY = e.above ? e.ty + 27 : e.ty + 27;
		ctx.fillText(e.label, e.align === "left" ? e.tx : e.align === "right" ? e.tx + e.tw : e.tx + e.tw / 2, labelY);
		ctx.fillText(String(e.year), e.align === "left" ? e.tx : e.align === "right" ? e.tx + e.tw : e.tx + e.tw / 2, yearY);
		hit(e.id, e.tx, e.ty - 14, e.tw, 48);
	}
}

try{const canvas=document.querySelector('canvas'),native=canvas.getContext('2d');let count=0;
 native.fillStyle='white';native.fillRect(0,0,800,500);native.fillStyle='#243544';native.strokeStyle='#243544';native.lineWidth=2;native.font='18px Arial';
 const ctx=new Proxy(native,{get(target,key){const v=target[key];if(typeof v!=='function')return v;return(...args)=>{if(++count>12000)throw Error('Drawing call limit');if(key==='fillText'||key==='strokeText'){const [text,x,y]=args,m=target.measureText(String(text)),fontSize=Number(target.font.match(/([0-9.]+)px/)?.[1]),transform=target.getTransform(),points=[[x-m.actualBoundingBoxLeft,y-m.actualBoundingBoxAscent],[x+m.actualBoundingBoxRight,y-m.actualBoundingBoxAscent],[x-m.actualBoundingBoxLeft,y+m.actualBoundingBoxDescent],[x+m.actualBoundingBoxRight,y+m.actualBoundingBoxDescent]].map(([x,y])=>new DOMPoint(x,y).matrixTransform(transform)),left=Math.min(...points.map(p=>p.x)),top=Math.min(...points.map(p=>p.y)),right=Math.max(...points.map(p=>p.x)),bottom=Math.max(...points.map(p=>p.y));window.__texts.push({text:String(text),x:left,y:top,width:right-left,height:bottom-top,fontSize:fontSize*Math.hypot(transform.a,transform.b)});}if(window.__draws.length<3000)window.__draws.push({op:key,args:args.map(v=>typeof v==='number'||typeof v==='string'?v:null)});return v.apply(target,args);};},set(target,key,value){target[key]=value;return true;}});
 const hit=(id,x,y,width,height)=>{if(typeof id!=='string'||id.length>120||![x,y,width,height].every(Number.isFinite)||width<0||height<0||window.__hits.length>=2000)throw Error('Invalid hit region');window.__hits.push({id,x,y,width,height});};
