function draw(ctx, hit) {
	ctx.clearRect(0, 0, 800, 500);
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(0, 0, 800, 500);
	ctx.strokeStyle = "#111111";
	ctx.fillStyle = "#111111";

	ctx.lineCap = "round";
	ctx.lineJoin = "round";
	ctx.font = "18px Arial";
	ctx.textAlign = "center";
	ctx.textBaseline = "middle";
	function arrow(id, x1, y1, x2, y2, label, lx, ly, hx, hy, hw, hh) {
		ctx.beginPath();
		ctx.moveTo(x1, y1);
		ctx.lineTo(x2, y2);
		ctx.stroke();
		const a = Math.atan2(y2 - y1, x2 - x1);
		const len = 11;
		ctx.beginPath();
		ctx.moveTo(x2, y2);
		ctx.lineTo(x2 - len * Math.cos(a - Math.PI / 6), y2 - len * Math.sin(a - Math.PI / 6));
		ctx.moveTo(x2, y2);
		ctx.lineTo(x2 - len * Math.cos(a + Math.PI / 6), y2 - len * Math.sin(a + Math.PI / 6));
		ctx.stroke();
		ctx.fillText(label, lx, ly);
		hit(id, hx, hy, hw, hh);
	}
	// Horizontal surface
	ctx.beginPath();
	ctx.moveTo(220, 310);
	ctx.lineTo(580, 310);
	ctx.stroke();
	hit("horizontal-surface", 220, 301, 360, 18);
	// Block
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(325, 225, 150, 70);
	ctx.strokeRect(325, 225, 150, 70);
	hit("block", 325, 225, 150, 70);
	arrow("force-N", 400, 225, 400, 135, "N", 423, 170, 385, 125, 50, 105);
	arrow("force-mg", 400, 295, 400, 375, "mg", 425, 350, 385, 290, 55, 100);
	arrow("force-F", 475, 260, 565, 260, "F", 535, 237, 470, 220, 110, 55);
	arrow("force-f", 325, 260, 235, 260, "f", 265, 237, 220, 220, 110, 55);
	ctx.textAlign = "left";
	ctx.font = "20px Arial";
	ctx.fillText("ΣFᵧ = N − mg = 0", 220, 414);
	hit("equation-y", 210, 394, 380, 40);
	ctx.fillText("ΣFₓ = F − f = ma", 220, 458);
	hit("equation-x", 210, 438, 380, 40);
}
