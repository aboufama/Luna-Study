<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'"><style>*{box-sizing:border-box}html,body{margin:0;width:800px;height:500px;overflow:hidden;font-family:Arial,sans-serif;background:white}#stage{position:relative;width:800px;height:500px}svg{overflow:visible}</style></head><body><main id="stage"><canvas width="800" height="500"></canvas></main><script>window.__done=false;window.__error=null;window.__texts=[];window.__hits=[];window.__draws=[];window.addEventListener('error',e=>window.__error=String(e.message).slice(0,180));

function draw(ctx, hit) {
	ctx.clearRect(0, 0, 800, 500);
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(0, 0, 800, 500);
	ctx.strokeStyle = "#202020";
	ctx.fillStyle = "#202020";
	ctx.lineWidth = 2;
	ctx.lineJoin = "round";
	ctx.lineCap = "round";
	ctx.font = "18px Arial";
	ctx.textAlign = "center";
	ctx.textBaseline = "middle";
	const stages = [
		{
			id: "observe",
			label: "Observe",
			x: 80
		},
		{
			id: "hypothesize",
			label: "Hypothesize",
			x: 320
		},
		{
			id: "test",
			label: "Test",
			x: 560
		}
	];
	const boxY = 205, boxW = 160, boxH = 70;
	for (const stage of stages) {
		ctx.strokeRect(stage.x, boxY, boxW, boxH);
		ctx.fillText(stage.label, stage.x + boxW / 2, boxY + boxH / 2);
		hit(stage.id, stage.x, boxY, boxW, boxH);
	}
	function arrow(x1, y1, x2, y2, id) {
		ctx.beginPath();
		ctx.moveTo(x1, y1);
		ctx.lineTo(x2, y2);
		ctx.stroke();
		const angle = Math.atan2(y2 - y1, x2 - x1);
		const size = 9;
		ctx.beginPath();
		ctx.moveTo(x2, y2);
		ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 6), y2 - size * Math.sin(angle - Math.PI / 6));
		ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 6), y2 - size * Math.sin(angle + Math.PI / 6));
		ctx.closePath();
		ctx.fill();
		hit(id, Math.min(x1, x2) - 10, Math.min(y1, y2) - 10, Math.abs(x2 - x1) + 20, Math.abs(y2 - y1) + 20);
	}
	arrow(240, 240, 308, 240, "observe-to-hypothesize");
	arrow(480, 240, 548, 240, "hypothesize-to-test");
	ctx.beginPath();
	ctx.moveTo(640, boxY);
	ctx.lineTo(640, 110);
	ctx.lineTo(160, 110);
	ctx.lineTo(160, boxY - 8);
	ctx.stroke();
	const a = Math.PI / 2, size = 9;
	ctx.beginPath();
	ctx.moveTo(160, boxY - 8);
	ctx.lineTo(160 - size * Math.cos(a - Math.PI / 6), boxY - 8 - size * Math.sin(a - Math.PI / 6));
	ctx.lineTo(160 - size * Math.cos(a + Math.PI / 6), boxY - 8 - size * Math.sin(a + Math.PI / 6));
	ctx.closePath();
	ctx.fill();
	ctx.fillText("Revise", 400, 82);
	hit("test-to-observe-revise", 150, 72, 500, 126);
}
