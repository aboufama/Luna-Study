<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Horizontal line city from 0 to 1, with vendor A at 0.2 and vendor B at 0.8">
  <title id="line-city-title">Line city and vendor positions</title>
  <desc id="line-city-desc">A horizontal line from endpoint 0 to endpoint 1. Vendor A is at 0.2 and vendor B is at 0.8.</desc>
  <g id="city-line">
    <line id="city-line-segment" x1="160" y1="260" x2="640" y2="260" stroke="#202833" stroke-width="3" stroke-linecap="round"/>
    <circle id="city-endpoint-0" cx="160" cy="260" r="6" fill="#202833"/>
    <circle id="city-endpoint-1" cx="640" cy="260" r="6" fill="#202833"/>
    <text id="city-endpoint-label-0" x="160" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#202833">0</text>
    <text id="city-endpoint-label-1" x="640" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#202833">1</text>
  </g>
  <g id="vendor-A">
    <line id="vendor-A-guide" x1="256" y1="230" x2="256" y2="260" stroke="#202833" stroke-width="2"/>
    <circle id="vendor-A-marker" cx="256" cy="260" r="9" fill="#ffffff" stroke="#202833" stroke-width="3"/>
    <text id="vendor-A-label" x="256" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#202833">Vendor A</text>
    <text id="vendor-A-position" x="256" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#202833">0.2</text>
  </g>
  <g id="vendor-B">
    <line id="vendor-B-guide" x1="544" y1="230" x2="544" y2="260" stroke="#202833" stroke-width="2"/>
    <circle id="vendor-B-marker" cx="544" cy="260" r="9" fill="#ffffff" stroke="#202833" stroke-width="3"/>
    <text id="vendor-B-label" x="544" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#202833">Vendor B</text>
    <text id="vendor-B-position" x="544" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#202833">0.8</text>
  </g>
</svg>