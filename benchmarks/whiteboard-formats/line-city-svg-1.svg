<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Horizontal city line from 0 to 1, with vendor A at 0.2 and vendor B at 0.8">
  <g id="city-line">
    <line id="city-line-segment" x1="100" y1="270" x2="700" y2="270" stroke="#17212b" stroke-width="3" stroke-linecap="round"/>
    <circle id="city-endpoint-0" cx="100" cy="270" r="6" fill="#17212b"/>
    <circle id="city-endpoint-1" cx="700" cy="270" r="6" fill="#17212b"/>
    <text id="city-label-0" x="100" y="305" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17212b">0</text>
    <text id="city-label-1" x="700" y="305" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17212b">1</text>
  </g>
  <g id="vendor-A">
    <line id="vendor-A-guide" x1="220" y1="228" x2="220" y2="260" stroke="#17212b" stroke-width="1.5"/>
    <circle id="vendor-A-marker" cx="220" cy="270" r="8" fill="#17212b"/>
    <text id="vendor-A-label" x="220" y="198" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#17212b">Vendor A</text>
    <text id="vendor-A-position" x="220" y="222" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17212b">0.2</text>
  </g>
  <g id="vendor-B">
    <line id="vendor-B-guide" x1="580" y1="228" x2="580" y2="260" stroke="#17212b" stroke-width="1.5"/>
    <circle id="vendor-B-marker" cx="580" cy="270" r="8" fill="#17212b"/>
    <text id="vendor-B-label" x="580" y="198" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#17212b">Vendor B</text>
    <text id="vendor-B-position" x="580" y="222" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17212b">0.8</text>
  </g>
</svg>