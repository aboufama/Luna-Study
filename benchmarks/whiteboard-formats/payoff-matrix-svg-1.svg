<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Player three B payoff matrix">
  <g id="matrix-title">
    <text id="player-label" x="400" y="88" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111111">Player 3 (B)</text>
  </g>
  <g id="matrix-column-labels" font-family="sans-serif" font-size="20" fill="#111111" text-anchor="middle" dominant-baseline="middle">
    <text id="column-label-L" x="355" y="145">L</text>
    <text id="column-label-R" x="525" y="145">R</text>
  </g>
  <g id="matrix-row-labels" font-family="sans-serif" font-size="20" fill="#111111" text-anchor="middle" dominant-baseline="middle">
    <text id="row-label-U" x="245" y="222.5">U</text>
    <text id="row-label-D" x="245" y="317.5">D</text>
  </g>
  <g id="matrixId">
    <rect id="matrixId-cell-0-0" x="270" y="175" width="170" height="95" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect id="matrixId-cell-0-1" x="440" y="175" width="170" height="95" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect id="matrixId-cell-1-0" x="270" y="270" width="170" height="95" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect id="matrixId-cell-1-1" x="440" y="270" width="170" height="95" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <g id="matrix-values" font-family="sans-serif" font-size="20" fill="#111111" text-anchor="middle" dominant-baseline="middle">
      <text id="matrix-value-0-0" x="355" y="222.5">7,7,0</text>
      <text id="matrix-value-0-1" x="525" y="222.5">1,6,1</text>
      <text id="matrix-value-1-0" x="355" y="317.5">6,1,1</text>
      <text id="matrix-value-1-1" x="525" y="317.5">0,0,1</text>
    </g>
  </g>
</svg>