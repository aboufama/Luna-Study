<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Graph of y equals x squared from x negative 2 to 2 and y 0 to 4, with axes, ticks, and five sample points">
  <title id="graph-title">y=x²</title>
  <desc id="graph-desc">Graph on x from -2 to 2 and y from 0 to 4, with labeled axes, tick values, and a connected curve through the five listed sample points.</desc>
  <g id="plot">
    <line id="x-axis" x1="90" y1="420" x2="730" y2="420" stroke="#17212b" stroke-width="2"/>
    <line id="y-axis" x1="410" y1="440" x2="410" y2="60" stroke="#17212b" stroke-width="2"/>
    <text id="x-label" x="742" y="425" font-family="sans-serif" font-size="18" fill="#17212b">x</text>
    <text id="y-label" x="400" y="50" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#17212b">y</text>
    <g id="x-ticks" stroke="#17212b" stroke-width="1.5">
      <line id="x-tick-0" x1="110" y1="415" x2="110" y2="425"/>
      <line id="x-tick-1" x1="260" y1="415" x2="260" y2="425"/>
      <line id="x-tick-2" x1="410" y1="415" x2="410" y2="425"/>
      <line id="x-tick-3" x1="560" y1="415" x2="560" y2="425"/>
      <line id="x-tick-4" x1="710" y1="415" x2="710" y2="425"/>
    </g>
    <g id="x-tick-labels" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#17212b">
      <text id="x-value-0" x="110" y="448">-2</text>
      <text id="x-value-1" x="260" y="448">-1</text>
      <text id="x-value-2" x="410" y="448">0</text>
      <text id="x-value-3" x="560" y="448">1</text>
      <text id="x-value-4" x="710" y="448">2</text>
    </g>
    <g id="y-ticks" stroke="#17212b" stroke-width="1.5">
      <line id="y-tick-0" x1="405" y1="420" x2="415" y2="420"/>
      <line id="y-tick-1" x1="405" y1="335" x2="415" y2="335"/>
      <line id="y-tick-2" x1="405" y1="250" x2="415" y2="250"/>
      <line id="y-tick-3" x1="405" y1="165" x2="415" y2="165"/>
      <line id="y-tick-4" x1="405" y1="80" x2="415" y2="80"/>
    </g>
    <g id="y-tick-labels" font-family="sans-serif" font-size="14" text-anchor="end" fill="#17212b">
      <text id="y-value-0" x="395" y="425">0</text>
      <text id="y-value-1" x="395" y="340">1</text>
      <text id="y-value-2" x="395" y="255">2</text>
      <text id="y-value-3" x="395" y="170">3</text>
      <text id="y-value-4" x="395" y="85">4</text>
    </g>
    <polyline id="curve" points="110,80 260,335 410,420 560,335 710,80" fill="none" stroke="#1769aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="sample-points" fill="#17212b">
      <circle id="point-0" cx="110" cy="80" r="5"/>
      <circle id="point-1" cx="260" cy="335" r="5"/>
      <circle id="point-2" cx="410" cy="420" r="5"/>
      <circle id="point-3" cx="560" cy="335" r="5"/>
      <circle id="point-4" cx="710" cy="80" r="5"/>
    </g>
    <g id="point-labels" font-family="sans-serif" font-size="14" fill="#17212b">
      <text id="point-label-0" x="120" y="72">(-2, 4)</text>
      <text id="point-label-1" x="270" y="328">(-1, 1)</text>
      <text id="point-label-2" x="420" y="405">(0, 0)</text>
      <text id="point-label-3" x="570" y="328">(1, 1)</text>
      <text id="point-label-4" x="650" y="72">(2, 4)</text>
    </g>
  </g>
</svg>