<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none" stroke="#425b70" stroke-width="2" font-family="Arial, sans-serif"><text id="equation-1" x="120" y="125" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">2x + 3 = 11</text><text id="step-1" x="344" y="125" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">subtract 3 from both sides</text><text id="equation-2" x="120" y="240" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">2x = 8</text><text id="step-2" x="344" y="240" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">divide both sides by 2</text><text id="final-equation" x="120" y="355" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">x = 4</text><line id="box-top" x1="96" y1="325" x2="240" y2="325"/><line id="box-bottom" x1="96" y1="390" x2="240" y2="390"/><line id="box-left" x1="96" y1="325" x2="96" y2="390"/><line id="box-right" x1="240" y1="325" x2="240" y2="390"/></svg>