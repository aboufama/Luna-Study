<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none" stroke="#425b70" stroke-width="2" font-family="Arial, sans-serif"><g id="block"><rect id="block-cell-0-0" x="80" y="87" width="670" height="350" fill="#ffffff"/><text id="block-cell-0-0-text" x="415" y="262" fill="#172c3f" stroke="none" font-size="20" text-anchor="middle" dominant-baseline="central">block</text></g><line id="surface" x1="200" y1="275" x2="600" y2="275"/><line id="normal-force" x1="400" y1="225" x2="400" y2="135"/><text id="normal-force-label" x="400" y="164" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">N</text><line id="weight-force" x1="400" y1="225" x2="400" y2="365"/><text id="weight-force-label" x="400" y="279" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">mg</text><line id="applied-force" x1="440" y1="225" x2="584" y2="225"/><text id="applied-force-label" x="512" y="209" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">F</text><line id="friction-force" x1="360" y1="225" x2="216" y2="225"/><text id="friction-force-label" x="288" y="209" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">f</text><text id="vertical-equation" x="200" y="415" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">ΣFᵧ = N − mg = 0</text><text id="horizontal-equation" x="200" y="455" fill="#172c3f" stroke="none" font-size="18" text-anchor="middle" dominant-baseline="central">ΣFₓ = F − f = ma</text></svg>